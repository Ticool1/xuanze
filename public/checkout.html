<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>确认订单 · 选择蛋糕店</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>" />
</head>
<body>
  <!-- ============ 结算页 ============ -->
  <div class="checkout-wrap" id="checkoutView">
    <div class="page-head">
      <button class="back-btn" id="backBtn" aria-label="返回">‹</button>
      <div class="page-title">确认订单</div>
    </div>

    <!-- 已选商品 -->
    <section class="section">
      <div class="section-title">已选商品 <span class="muted" id="itemsCount"></span></div>
      <div class="order-items" id="orderItems"></div>
      <div class="total-row">
        <span>合计</span>
        <span class="big" id="totalAmount">¥0.00</span>
      </div>
    </section>

    <!-- 联系信息 -->
    <section class="section">
      <div class="section-title">联系信息</div>

      <div class="field" id="fieldName">
        <label for="inputName">怎么称呼您<span class="req">*</span></label>
        <input type="text" id="inputName" placeholder="例如：张女士" maxlength="20" autocomplete="name" />
        <div class="field-error">请填写怎么称呼您</div>
      </div>

      <div class="field" id="fieldPhone">
        <label for="inputPhone">您的手机号<span class="req">*</span></label>
        <input type="tel" id="inputPhone" placeholder="11 位手机号" maxlength="11" inputmode="numeric" autocomplete="tel" />
        <div class="field-error">请填写正确的 11 位手机号</div>
      </div>
    </section>

    <!-- 交货方式 -->
    <section class="section">
      <div class="section-title">交货方式</div>

      <div class="field" id="fieldMode">
        <div class="segmented" id="modeSeg">
          <label class="checked" data-mode="delivery">
            <input type="radio" name="mode" value="delivery" checked />
            🛵 配送
          </label>
          <label data-mode="pickup">
            <input type="radio" name="mode" value="pickup" />
            🏪 自取
          </label>
        </div>
      </div>

      <!-- 仅配送时显示 -->
      <div class="field" id="fieldAddress">
        <label for="inputAddress">收货地址<span class="req">*</span></label>
        <textarea id="inputAddress" placeholder="请填写详细地址，例如：XX市XX区XX路XX号X栋X单元X室" maxlength="120"></textarea>
        <div class="field-error">配送需要填写收货地址</div>
      </div>

      <div class="field" id="fieldTime">
        <label for="inputTime"><span id="timeLabel">期望送达时间</span><span class="req">*</span></label>
        <input type="text" id="inputTime" placeholder="例如：今天 18:00 前送达" maxlength="40" />
        <div class="hint" id="timeHint">请填写您希望送达的时间，例如「今天 18:00」或「明天上午 10 点」</div>
        <div class="field-error">请填写期望时间</div>
      </div>

      <div class="field">
        <label for="inputRemark">备注（选填）</label>
        <input type="text" id="inputRemark" placeholder="口味、忌口、其他要求等" maxlength="100" />
      </div>
    </section>

    <section class="section">
      <div class="hint" style="text-align:center;margin-top:4px">
        提交后我们会尽快与您联系确认，暂不涉及线上支付
      </div>
    </section>

    <div class="submit-bar">
      <div class="sum">合计 <b id="barAmount">¥0.00</b></div>
      <button class="btn-primary" id="submitBtn" disabled>提交订单</button>
    </div>
  </div>

  <!-- ============ 成功页 ============ -->
  <div class="checkout-wrap hidden" id="successView">
    <div class="success-box">
      <div class="success-icon">✓</div>
      <div class="success-title">订单已提交</div>
      <div class="order-no" id="successOrderNo">订单号</div>
      <div class="success-desc" id="successDesc">
        我们会尽快与您联系确认，请保持手机畅通。
      </div>
    </div>
    <div style="padding:0 24px">
      <button class="btn-primary" style="width:100%" id="backHomeBtn">继续选购</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'xz_cart_v1';
      const LAST_ORDER_KEY = 'xz_last_profile_v1';

      const $ = (id) => document.getElementById(id);
      const state = {
        products: new Map(),
        cart: {},
        items: [],
        amount: 0,
        count: 0,
        mode: 'delivery',
        submitting: false
      };

      // ---- 工具 ----
      const toastEl = $('toast');
      let toastTimer = null;
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
      }

      function money(n) {
        return '¥' + (Math.round(Number(n || 0) * 100) / 100).toFixed(2);
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function thumbStyle(image) {
        if (!image) return 'background-image:none;display:flex;';
        return `background-image:url('${String(image).replace(/'/g, "\\'")}');`;
      }

      async function api(path, opts) {
        const res = await fetch(path, {
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          ...opts
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || '请求失败');
        return data;
      }

      // ---- 读取购物车 ----
      function loadCart() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          state.cart = raw ? JSON.parse(raw) || {} : {};
        } catch {
          state.cart = {};
        }
      }

      function clearCart() {
        state.cart = {};
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) { /* ignore */ }
      }

      // ---- 渲染已选商品 ----
      function renderItems() {
        const entries = Object.entries(state.cart)
          .map(([pid, qty]) => {
            const p = state.products.get(Number(pid));
            return p ? { p, qty } : null;
          })
          .filter(Boolean);

        state.items = entries;
        state.amount = Math.round(entries.reduce((s, it) => s + it.p.price * it.qty, 0) * 100) / 100;
        state.count = entries.reduce((s, it) => s + it.qty, 0);

        $('itemsCount').textContent = state.count ? `共 ${state.count} 件` : '';
        $('totalAmount').textContent = money(state.amount);
        $('barAmount').textContent = money(state.amount);

        if (!entries.length) {
          $('orderItems').innerHTML = '<div class="empty">购物车是空的</div>';
          $('submitBtn').disabled = true;
          $('submitBtn').textContent = '购物车为空';
          return;
        }

        $('orderItems').innerHTML = entries
          .map(
            ({ p, qty }) => `
            <div class="order-item">
              <div class="order-item-thumb" style="${thumbStyle(p.image)}"></div>
              <div class="order-item-name">${esc(p.name)}</div>
              <div class="order-item-qty">×${qty}</div>
              <div class="order-item-price">${money(p.price * qty)}</div>
            </div>`
          )
          .join('');

        $('submitBtn').textContent = '提交订单';
        checkForm();
      }

      // ---- 交货方式切换 ----
      function applyMode() {
        const isDelivery = state.mode === 'delivery';
        $('fieldAddress').classList.toggle('hidden', !isDelivery);
        $('timeLabel').textContent = isDelivery ? '期望送达时间' : '预计提取时间';
        $('timeHint').textContent = isDelivery
          ? '请填写您希望送达的时间，例如「今天 18:00」或「明天上午 10 点」'
          : '请填写您方便到店提取的时间，例如「今天 19:00」或「明天下午 3 点」';
        $('inputTime').placeholder = isDelivery ? '例如：今天 18:00 前送达' : '例如：今天 19:00 到店自取';
        document.querySelectorAll('#modeSeg label').forEach((l) => {
          l.classList.toggle('checked', l.dataset.mode === state.mode);
        });
        checkForm();
      }

      // ---- 表单校验 ----
      function validPhone(v) {
        return /^1[3-9]\d{9}$/.test(v);
      }

      function checkForm() {
        if (!state.count) {
          $('submitBtn').disabled = true;
          return;
        }
        const name = $('inputName').value.trim();
        const phone = $('inputPhone').value.trim();
        const address = $('inputAddress').value.trim();
        const time = $('inputTime').value.trim();

        const ok =
          !!name &&
          validPhone(phone) &&
          !!time &&
          (state.mode === 'pickup' || !!address) &&
          !state.submitting;

        $('submitBtn').disabled = !ok;
        $('submitBtn').textContent = state.submitting ? '提交中…' : '提交订单';
      }

      function showError(fieldId) {
        const el = $(fieldId);
        if (!el) return;
        el.classList.add('has-error');
        setTimeout(() => el.classList.remove('has-error'), 2600);
      }

      ['inputName', 'inputPhone', 'inputAddress', 'inputTime'].forEach((id) => {
        $(id).addEventListener('input', () => {
          $(id).parentElement.classList.remove('has-error');
          checkForm();
        });
      });

      document.querySelectorAll('#modeSeg label').forEach((label) => {
        label.addEventListener('click', () => {
          state.mode = label.dataset.mode;
          const input = label.querySelector('input');
          if (input) input.checked = true;
          applyMode();
          try {
            api('/api/visit', {
              method: 'POST',
              body: JSON.stringify({ event: 'checkout_view', path: '/checkout', extra: '切换为' + (state.mode === 'delivery' ? '配送' : '自取') })
            }).catch(() => {});
          } catch (_) { /* ignore */ }
        });
      });

      // ---- 提交 ----
      async function submit() {
        if ($('submitBtn').disabled || state.submitting) return;

        const name = $('inputName').value.trim();
        const phone = $('inputPhone').value.trim();
        const address = $('inputAddress').value.trim();
        const time = $('inputTime').value.trim();
        const remark = $('inputRemark').value.trim();

        if (!name) return showError('fieldName');
        if (!validPhone(phone)) return showError('fieldPhone');
        if (state.mode === 'delivery' && !address) return showError('fieldAddress');
        if (!time) return showError('fieldTime');

        state.submitting = true;
        checkForm();

        try {
          const payload = {
            name,
            phone,
            mode: state.mode,
            address: state.mode === 'delivery' ? address : '',
            expectTime: time,
            remark,
            items: state.items.map((it) => ({ id: it.p.id, qty: it.qty }))
          };
          const r = await api('/api/orders', { method: 'POST', body: JSON.stringify(payload) });

          // 记住本次填写，下次自动带出
          try {
            localStorage.setItem(LAST_ORDER_KEY, JSON.stringify({ name, phone, address }));
          } catch (_) { /* ignore */ }

          clearCart();
          showSuccess(r.orderNo, r.amount);
        } catch (err) {
          toast(err.message || '提交失败，请重试');
          state.submitting = false;
          checkForm();
        }
      }

      $('submitBtn').addEventListener('click', submit);

      // ---- 成功页 ----
      function showSuccess(orderNo, amount) {
        $('checkoutView').classList.add('hidden');
        $('successView').classList.remove('hidden');
        $('successOrderNo').textContent = orderNo || '';
        const isDelivery = state.mode === 'delivery';
        $('successDesc').innerHTML =
          `订单金额 <b style="color:#b85252">${money(amount)}</b><br>` +
          (isDelivery
            ? '我们会尽快安排配送，请您保持手机畅通。'
            : '我们会尽快确认，请您按约定时间到店提取。') +
          '<br><span style="font-size:12px;color:#9a9a9a">暂不涉及线上支付</span>';
        window.scrollTo(0, 0);
      }

      $('backHomeBtn').addEventListener('click', () => {
        location.href = '/';
      });

      $('backBtn').addEventListener('click', () => {
        location.href = '/';
      });

      // ---- 初始化 ----
      async function init() {
        loadCart();

        // 优先用本地记住的信息自动填充（同一手机扫码用户）
        let preset = null;
        try {
          const raw = localStorage.getItem(LAST_ORDER_KEY);
          if (raw) preset = JSON.parse(raw);
        } catch (_) { /* ignore */ }

        // 服务端也记了客户信息（跨浏览器/清缓存后仍可带出）
        try {
          const v = await api('/api/visitor');
          if (v.customer && v.customer.name) {
            preset = preset || {};
            preset.name = preset.name || v.customer.name;
            preset.phone = preset.phone || v.customer.phone;
          }
        } catch (_) { /* ignore */ }

        if (preset) {
          if (preset.name) $('inputName').value = preset.name;
          if (preset.phone) $('inputPhone').value = preset.phone;
          if (preset.address) $('inputAddress').value = preset.address;
        }

        try {
          const menu = await api('/api/menu');
          for (const cat of menu.categories || []) {
            for (const p of cat.products) state.products.set(p.id, p);
          }
        } catch (_) { /* ignore */ }

        try {
          api('/api/visit', {
            method: 'POST',
            body: JSON.stringify({ event: 'checkout_view', path: '/checkout', extra: '进入结算页' })
          }).catch(() => {});
        } catch (_) { /* ignore */ }

        applyMode();
        renderItems();
      }

      init();
    })();
  </script>
</body>
</html>
